[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pybank"
version = "0.1.0"
description = "Download bank statements and import them into Beancount"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Wittek", email = "thomas@wittek.me"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.0.0",
    "beancount-dkb>=1.10.0",
    "beangulp>=0.2.0",
    "beanprice>=2.1.0",
    "click>=8.1",
    "ibflex[web]>=1.1",
    "pydantic>=2.8.0",
    "selenium>=4.35.0",
]

[project.scripts]
pybank-fetch = "pybank.fetch:main"
pybank-import = "pybank.ingest:main"

[project.optional-dependencies]
categorize = [
    "openai>=3.7",
]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "pytest>=8.4.1",
    "ruff>=0.16.0",
]

[tool.hatch.build]
# The built review page is gitignored, which hatch would otherwise skip.
artifacts = ["src/pybank/web/static"]

[tool.pytest.ini_options]
# Lets the test tree mirror the package without __init__.py files, and
# without basenames having to be unique across the tree.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
# Ruff reformats Python blocks inside Markdown.
extend-exclude = ["docs"]

[tool.ruff.lint]
# `ruff format` reflows code but never docstrings or comments, so prose has
# nothing holding it to a width. W505 is the only check that reads it. D holds
# docstrings to PEP 257.
extend-select = ["D", "W505"]
# D1: A docstring that only restates the name is noise, so none is required.
# D401: Summaries use the third person ("Returns ...", "Splits ..."), and
# D401 wants the imperative ("Return ...").
# DTZ: Transaction dates are calendar dates. Timezone-aware datetimes would
# attach a value we do not have. The real fix is datetime.date, which the
# Beancount importers already use.
ignore = ["D1", "D401", "DTZ"]

[tool.ruff.lint.pycodestyle]
# Prose wraps narrower than the 100 columns code gets, which is what the
# Beancount importers already do by hand.
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "pep257"
