[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pybank"
version = "0.1.0"
description = "Download and convert bank statements"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Wittek", email = "thomas@wittek.me"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.0.0",
    "beangulp>=0.2.0",
    "charset-normalizer>=3.4.3",
    "pydantic>=2.8.0",
    "selenium>=4.35.0",
]

[project.scripts]
pybank-fetch = "pybank.fetch:main"
pybank-convert = "pybank.convert:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.4.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# Lets the test tree mirror the package without __init__.py files, and
# without basenames having to be unique across the tree.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
# Ruff reformats Python blocks inside Markdown.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Transaction dates are calendar dates. Timezone-aware datetimes would
# attach a value we do not have. The real fix is datetime.date, which the
# Beancount importers already use.
ignore = ["DTZ"]
